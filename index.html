        <rect x="30" y="152" width="340" height="18" />

    <symbol id="i-guests" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 42 V20 C10 12 16 7 24 4 C32 7 38 12 38 20 V42" /><path d="M16 42 V24 C16 19 20 15 24 13 C28 15 32 19 32 24 V42" /><circle cx="24" cy="25" r="1.4" /><path d="M6 42 H42" /></g></symbol>
    <symbol id="i-rings" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="18" cy="28" r="10" /><circle cx="30" cy="28" r="10" /><path d="M26 14 L30 9 L34 14 L30 17 Z" stroke-linejoin="round" /><path d="M27 9 L33 9" /></g></symbol>

<!-- ============ Fixed controls ============ -->
<button class="pill pill--lang" id="langBtn" type="button" aria-label="Change language">
  <svg viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9" /><path d="M3 12 H21 M12 3 C15 6 15 18 12 21 C9 18 9 6 12 3" /></g></svg>
  <span id="langLabel">বাংলা</span>
</button>
<button class="round-btn" id="musicBtn" type="button" aria-label="Play music" aria-pressed="false" hidden>
  <svg viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10 V14 H8 L13 18 V6 L8 10 Z" /><path class="wave" d="M16.5 9 C17.7 10.5 17.7 13.5 16.5 15" /><path class="wave" d="M19 6.5 C21.5 9.5 21.5 14.5 19 17.5" /><path class="mute" d="M16 9 L21 15 M21 9 L16 15" /></g></svg>
</button>
<audio id="music" loop preload="none"></audio>

<!-- ============ GATE (behind the envelope) ============ -->
<div class="gate" id="gate" aria-hidden="true">
  <div class="gate__light"></div>
  <div class="gate__door gate__door--left"><div class="door-panel"></div><span class="door-ring"></span></div>
  <div class="gate__door gate__door--right"><div class="door-panel"></div><span class="door-ring"></span></div>
</div>

<!-- ============ ENVELOPE ============ -->
<div class="envelope" id="envelope">
  <svg class="env-crease" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0 100 L50 57 L100 100" vector-effect="non-scaling-stroke" />
  </svg>

  <svg class="env-vine env-vine--left" viewBox="0 0 60 400" aria-hidden="true"><use href="#vine" /></svg>
  <svg class="env-vine env-vine--right" viewBox="0 0 60 400" aria-hidden="true"><use href="#vine" /></svg>

  <svg class="env-bottom" viewBox="-120 -60 240 120" aria-hidden="true">
    <use href="#vine" x="-30" y="-40" width="60" height="400" transform="rotate(-62) scale(.35)" />
    <use href="#vine" x="-30" y="-40" width="60" height="400" transform="scale(-1 1) rotate(-62) scale(.35)" />
    <use href="#blossomGold" x="-20" y="-20" width="40" height="40" transform="translate(0 -6) scale(1.6)" />
    <use href="#blossomGold" x="-20" y="-20" width="40" height="40" transform="translate(-34 8) scale(1.1)" />
  </svg>

  <div class="env-flap-wrap">
    <div class="env-flap" id="flap">
      <svg class="flap-art" viewBox="-160 -110 320 220" aria-hidden="true">
        <g class="emboss-g">
          <use href="#vine" x="-30" y="0" width="60" height="400" transform="rotate(-118) scale(.42)" />
          <use href="#vine" x="-30" y="0" width="60" height="400" transform="scale(-1 1) rotate(-118) scale(.42)" />
          <g transform="translate(0 -28) scale(.95)">
            <g fill="#F4ECDF"><use href="#petOuter" /><use href="#petOuter" transform="rotate(45)" /><use href="#petOuter" transform="rotate(90)" /><use href="#petOuter" transform="rotate(135)" /><use href="#petOuter" transform="rotate(180)" /><use href="#petOuter" transform="rotate(225)" /><use href="#petOuter" transform="rotate(270)" /><use href="#petOuter" transform="rotate(315)" />
              <g transform="rotate(22) scale(.62)"><use href="#petOuter" /><use href="#petOuter" transform="rotate(60)" /><use href="#petOuter" transform="rotate(120)" /><use href="#petOuter" transform="rotate(180)" /><use href="#petOuter" transform="rotate(240)" /><use href="#petOuter" transform="rotate(300)" /></g>
            </g>
            <circle r="8" fill="#E9DDC7" />
          </g>
        </g>
        <use href="#blossomGold" x="-20" y="-20" width="40" height="40" transform="translate(-74 -62) scale(1.25)" />
        <use href="#blossomGold" x="-20" y="-20" width="40" height="40" transform="translate(72 -48) scale(.95)" />
      </svg>
    </div>
  </div>

  <div class="seal-wrap">
    <span class="seal-glow" aria-hidden="true"></span>
    <span class="seal-orbit" aria-hidden="true"></span>
    <button class="seal" id="seal" type="button" aria-label="Open the invitation">
      <svg viewBox="0 0 120 120" aria-hidden="true">
        <path class="seal__wax" d="M60 4 C68 4 70 9 77 10 C85 11 89 7 95 12 C101 17 98 23 102 29 C106 35 113 37 114 45 C115 53 109 56 110 63 C111 71 116 76 113 84 C110 92 103 91 99 98 C95 104 96 111 88 114 C80 117 76 111 68 113 C61 115 57 120 49 117 C41 114 41 108 34 104 C27 100 20 102 15 95 C10 88 14 82 11 75 C8 68 2 64 4 56 C6 48 12 46 13 39 C14 31 9 25 14 19 C19 13 26 16 32 12 C39 8 41 4 49 4 C53 4 56 4 60 4 Z" />
        <circle cx="60" cy="60" r="40" class="seal__ring" />
        <circle cx="60" cy="60" r="35" class="seal__ring seal__ring--thin" />
      </svg>
      <span class="seal__mono" id="monogram">N&amp;E</span>
    </button>
  </div>

  <div class="env-to">
    <span class="env-to__for" data-t="forGuest">For</span>
    <span class="env-to__name" id="guestName">our dear guest</span>
  </div>
  <p class="env-hint" data-t="tapToOpen">Tap the seal to open</p>

  <button class="pill pill--skip" id="skipBtn" type="button" data-t="skip">Skip</button>
</div>

<!-- ============ PAGE ============ -->
<main id="page" tabindex="-1">

  <!-- Hero: the arch with the mosque -->
  <section class="hero" aria-label="Invitation">
    <svg class="corner corner--tl" viewBox="-120 -120 240 240" aria-hidden="true"><use href="#cluster" x="-120" y="-120" width="240" height="240" /></svg>
    <svg class="corner corner--tr" viewBox="-120 -120 240 240" aria-hidden="true"><use href="#cluster" x="-120" y="-120" width="240" height="240" /></svg>

    <div class="arch">
      <div class="scene">
        <div class="sky"></div>
        <div class="sun"></div>
        <div class="cloud cloud--1"></div><div class="cloud cloud--2"></div><div class="cloud cloud--3"></div>

        <div class="birds" aria-hidden="true">
          <svg class="bird b1" viewBox="0 0 24 10"><path d="M0 7 Q6 0 12 7 Q18 0 24 7" /></svg>
          <svg class="bird b2" viewBox="0 0 24 10"><path d="M0 7 Q6 0 12 7 Q18 0 24 7" /></svg>
          <svg class="bird b3" viewBox="0 0 24 10"><path d="M0 7 Q6 0 12 7 Q18 0 24 7" /></svg>
          <svg class="bird b4" viewBox="0 0 24 10"><path d="M0 7 Q6 0 12 7 Q18 0 24 7" /></svg>
          <svg class="bird b5" viewBox="0 0 24 10"><path d="M0 7 Q6 0 12 7 Q18 0 24 7" /></svg>
        </div>

        <svg class="mosque" viewBox="0 -12 400 182" aria-hidden="true"><use href="#mosque" x="0" y="0" width="400" height="170" /></svg>
        <div class="water"></div>
        <svg class="mosque mosque--reflect" viewBox="0 -12 400 182" aria-hidden="true"><use href="#mosque" x="0" y="0" width="400" height="170" /></svg>
        <div class="shimmer"></div>

        <div class="hero-text">
          <p class="hero-invite" data-t="heroInvite">You are invited to the wedding of</p>
          <h1 class="hero-names">
            <span class="goldtext" data-t="groomShort">Nasif</span>
            <span class="hero-and" data-t="and">&amp;</span>
            <span class="goldtext" data-t="brideShort">Esmat</span>
          </h1>
        </div>

        <a class="scroll-hint" href="#verse">
          <span data-t="scroll">Scroll down</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9 L12 15 L18 9" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" /></svg>
        </a>
      </div>

      <svg class="arch-trim" viewBox="0 0 100 160" preserveAspectRatio="none" aria-hidden="true">
        <path class="trim-wall" d="M0 160 V64 C0 40 18 26 32 18 C42 12 48 6 50 0 C52 6 58 12 68 18 C82 26 100 40 100 64 V160" vector-effect="non-scaling-stroke" />
        <path class="trim-gold" d="M0 160 V64 C0 40 18 26 32 18 C42 12 48 6 50 0 C52 6 58 12 68 18 C82 26 100 40 100 64 V160" vector-effect="non-scaling-stroke" />
        <path class="trim-inner" d="M3 160 V64.5 C3 42 20 29 33.5 21 C43 15 48 9.5 50 4 C52 9.5 57 15 66.5 21 C80 29 97 42 97 64.5 V160" vector-effect="non-scaling-stroke" />
      </svg>

      <svg class="lantern lantern--l" viewBox="0 0 40 130" aria-hidden="true"><use href="#lantern" /></svg>
      <svg class="lantern lantern--r" viewBox="0 0 40 130" aria-hidden="true"><use href="#lantern" /></svg>

      <svg class="arch-flowers arch-flowers--bl" viewBox="-120 -120 240 240" aria-hidden="true"><use href="#cluster" x="-120" y="-120" width="240" height="240" /></svg>
      <svg class="arch-flowers arch-flowers--br" viewBox="-120 -120 240 240" aria-hidden="true"><use href="#cluster" x="-120" y="-120" width="240" height="240" /></svg>
    </div>

    <svg class="corner corner--bl" viewBox="-120 -120 240 240" aria-hidden="true"><use href="#cluster" x="-120" y="-120" width="240" height="240" /></svg>
    <svg class="corner corner--br" viewBox="-120 -120 240 240" aria-hidden="true"><use href="#cluster" x="-120" y="-120" width="240" height="240" /></svg>
  </section>

  <div class="content">

    <!-- Verses -->
    <section class="verse" id="verse">
      <div class="verse-pill">
        <svg class="ornament ornament--top" viewBox="0 0 160 20" aria-hidden="true"><use href="#flourish" /></svg>
        <p class="arabic" lang="ar" dir="rtl" id="ayahLong"></p>
        <p class="verse-trans" data-t="ayahLongTrans"></p>
        <p class="verse-ref" data-t="ayahLongRef"></p>
        <svg class="ornament ornament--bottom" viewBox="0 0 160 20" aria-hidden="true"><use href="#flourish" /></svg>
      </div>

      <div class="verse-card">
        <p class="arabic arabic--big" lang="ar" dir="rtl" id="ayahShort"></p>
        <p class="verse-card__trans" data-t="ayahShortTrans"></p>
        <p class="verse-ref" data-t="ayahShortRef"></p>
        <svg class="rings" viewBox="0 0 160 90" aria-hidden="true">
          <circle class="ring ring--1" cx="62" cy="52" r="30" pathLength="1" />
          <circle class="ring ring--2" cx="98" cy="52" r="30" pathLength="1" />
          <path class="ring-stone" d="M92 16 L98 8 L104 16 L98 21 Z" />
        </svg>
      </div>
    </section>

    <!-- Formal invitation -->
    <section class="invite">
      <div class="invite-card">
        <svg class="invite-cap" viewBox="0 0 100 34" preserveAspectRatio="none" aria-hidden="true">
          <path d="M0 34 C0 20 18 14 32 9 C42 6 48 3 50 0 C52 3 58 6 68 9 C82 14 100 20 100 34" vector-effect="non-scaling-stroke" />
        </svg>
        <div class="invite-body">
          <p class="bismillah goldtext" lang="ar" dir="rtl">بِسْمِ ٱللَّٰهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ</p>
          <p class="caps" data-t="cardIntro"></p>
          <p class="script-name goldtext" data-t="groomFull"></p>
          <p class="parents" data-t="groomParents"></p>
          <p class="script-with" data-t="with"></p>
          <p class="script-name goldtext" data-t="brideFull"></p>
          <p class="parents" data-t="brideParents"></p>
          <svg class="ornament" viewBox="0 0 160 20" aria-hidden="true"><use href="#flourish" /></svg>
          <p class="script-heading" data-t="dearHeading"></p>
          <p class="invite-text" data-t="inviteBody"></p>
        </div>
        <svg class="invite-flowers invite-flowers--l" viewBox="-120 -120 240 240" aria-hidden="true"><use href="#cluster" x="-120" y="-120" width="240" height="240" /></svg>
        <svg class="invite-flowers invite-flowers--r" viewBox="-120 -120 240 240" aria-hidden="true"><use href="#cluster" x="-120" y="-120" width="240" height="240" /></svg>
      </div>
    </section>

    <!-- Countdown -->
    <section class="block">
      <h2 class="script-heading" data-t="countdownHeading"></h2>
      <svg class="ornament" viewBox="0 0 160 20" aria-hidden="true"><use href="#flourish" /></svg>
      <div class="countdown" id="countdown">
        <div class="cd"><span class="cd__num" data-unit="d">00</span><span class="cd__label" data-t="days"></span></div>
        <span class="cd__sep" aria-hidden="true">:</span>
        <div class="cd"><span class="cd__num" data-unit="h">00</span><span class="cd__label" data-t="hours"></span></div>
        <span class="cd__sep" aria-hidden="true">:</span>
        <div class="cd"><span class="cd__num" data-unit="m">00</span><span class="cd__label" data-t="minutes"></span></div>
        <span class="cd__sep" aria-hidden="true">:</span>
        <div class="cd"><span class="cd__num" data-unit="s">00</span><span class="cd__label" data-t="seconds"></span></div>
      </div>
      <p class="countdown-done script-heading" id="countdownDone" data-t="countdownDone" hidden></p>
    </section>

    <!-- Scratch to reveal the date -->
    <section class="block">
      <h2 class="script-heading" data-t="dateHeading"></h2>
      <svg class="ornament" viewBox="0 0 160 20" aria-hidden="true"><use href="#flourish" /></svg>
      <div class="scratch" id="scratch">
        <div class="scratch__under">
          <span class="scratch__weekday" id="sWeekday"></span>
          <span class="scratch__day" id="sDay"></span>
          <span class="scratch__month" id="sMonth"></span>
        </div>
        <canvas class="scratch__foil" id="scratchCanvas" aria-label="Gold foil. Scratch to reveal the date."></canvas>
        <svg class="scratch__rim" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
          <path d="M50 97 C20 76 2 58 2 33 C2 15 15 3 30 3 C40 3 46 9 50 17 C54 9 60 3 70 3 C85 3 98 15 98 33 C98 58 80 76 50 97 Z" vector-effect="non-scaling-stroke" />
        </svg>
        <span class="sparkles" id="sparkles" aria-hidden="true"></span>
      </div>
      <p class="scratch-hint" id="scratchHint">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11 V5.5 a1.5 1.5 0 0 1 3 0 V11 M12 10 V8.5 a1.5 1.5 0 0 1 3 0 V11 M15 10.5 a1.5 1.5 0 0 1 3 0 V15 c0 3.5 -2.5 6 -6 6 c-2.6 0 -4.2 -1.3 -5.4 -3.3 L4.4 14 a1.5 1.5 0 0 1 2.6 -1.5 L9 15" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /></svg>
        <span data-t="scratchHint"></span>
      </p>
    </section>

    <!-- Timeline -->
    <section class="block">
      <h2 class="script-heading" data-t="timelineHeading"></h2>
      <svg class="ornament" viewBox="0 0 160 20" aria-hidden="true"><use href="#flourish" /></svg>
      <ol class="timeline" id="timeline"></ol>
    </section>

    <!-- Venue -->
    <section class="block">
      <h2 class="script-heading" data-t="venueHeading"></h2>
      <svg class="ornament" viewBox="0 0 160 20" aria-hidden="true"><use href="#flourish" /></svg>
      <p class="venue-name" data-t="venueName"></p>
      <p class="venue-addr" data-t="venueAddress"></p>
      <div class="map-frame">
        <iframe id="mapFrame" title="Map of the venue" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe>
      </div>
      <a class="btn btn--gold" id="mapLink" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 21 s-7 -6.2 -7 -11 a7 7 0 1 1 14 0 c0 4.8 -7 11 -7 11 z" /><circle cx="12" cy="10" r="2.5" /></g></svg>
        <span data-t="viewMap"></span>
      </a>
    </section>

    <!-- Attire -->
    <section class="block">
      <h2 class="script-heading" data-t="attireHeading"></h2>
      <svg class="ornament" viewBox="0 0 160 20" aria-hidden="true"><use href="#flourish" /></svg>
      <svg class="attire-icon" viewBox="0 0 48 48" aria-hidden="true"><use href="#i-hanger" /></svg>
      <p class="body-text" data-t="attireBody"></p>
      <div class="swatches" id="swatches"></div>
    </section>

    <!-- RSVP -->
    <section class="block" id="rsvp">
      <h2 class="script-heading" data-t="rsvpHeading"></h2>
      <svg class="ornament" viewBox="0 0 160 20" aria-hidden="true"><use href="#flourish" /></svg>
      <p class="rsvp-sub" id="rsvpSub"></p>

      <form class="rsvp" id="rsvpForm" novalidate>
        <label class="field">
          <span data-t="fName"></span>
          <input name="name" id="rsvpName" autocomplete="name" maxlength="80" />
        </label>
        <label class="field">
          <span><span data-t="fPhone"></span> <em data-t="optional"></em></span>
          <input name="phone" type="tel" inputmode="tel" autocomplete="tel" maxlength="20" />
        </label>
        <fieldset class="choice">
          <legend data-t="fComing"></legend>
          <label class="choice__tile"><input type="radio" name="attending" value="Yes" /><span data-t="yes"></span></label>
          <label class="choice__tile"><input type="radio" name="attending" value="No" /><span data-t="no"></span></label>
        </fieldset>
        <div class="field" id="guestsField" hidden>
          <span id="guestsLabel" data-t="fGuests"></span>
          <div class="stepper" role="group" aria-labelledby="guestsLabel">
            <button type="button" data-step="-1" aria-label="−1">−</button>
            <output id="guestsOut" aria-live="polite">1</output>
            <button type="button" data-step="1" aria-label="+1">+</button>
          </div>
        </div>
        <label class="field">
          <span><span data-t="fMessage"></span> <em data-t="optional"></em></span>
          <textarea name="message" rows="3" maxlength="500"></textarea>
        </label>
        <p class="rsvp-error" id="rsvpError" role="alert"></p>
        <button class="btn btn--gold btn--wide" id="rsvpSubmit" type="submit" data-t="send"></button>
      </form>

      <div class="rsvp-done" id="rsvpDone" tabindex="-1" hidden>
        <svg viewBox="0 0 160 90" class="rings rings--done" aria-hidden="true">
          <circle class="ring ring--1" cx="62" cy="52" r="30" pathLength="1" />
          <circle class="ring ring--2" cx="98" cy="52" r="30" pathLength="1" />
        </svg>
        <p class="script-heading rsvp-done__title" id="doneTitle"></p>
        <p class="body-text" id="doneText"></p>
        <button class="link-btn" type="button" id="rsvpAgain" data-t="change"></button>
      </div>
    </section>

    <!-- Closing -->
    <footer class="closing">
      <p class="caps" data-t="blessing"></p>
      <p class="closing-names goldtext"><span data-t="groomShort"></span><span class="closing-and" data-t="and"></span><span data-t="brideShort"></span></p>
      <p class="closing-date" id="closingDate"></p>
      <svg class="ornament" viewBox="0 0 160 20" aria-hidden="true"><use href="#flourish" /></svg>
      <p class="credit"><span data-t="credit"></span><br /><em data-t="joke"></em></p>
      <svg class="closing-flowers closing-flowers--l" viewBox="-120 -120 240 240" aria-hidden="true"><use href="#cluster" x="-120" y="-120" width="240" height="240" /></svg>
      <svg class="closing-flowers closing-flowers--r" viewBox="-120 -120 240 240" aria-hidden="true"><use href="#cluster" x="-120" y="-120" width="240" height="240" /></svg>
    </footer>
  </div>
</main>

<div class="petals" id="petals" aria-hidden="true"></div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
