<body class="is-sealed">

<!-- ============ Shared drawings ============ -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8A6A3A" /><stop offset=".35" stop-color="#C9A462" /><stop offset=".55" stop-color="#F1DDAE" />
      <stop offset=".75" stop-color="#B08D57" /><stop offset="1" stop-color="#8A6A3A" />
    </linearGradient>
    <radialGradient id="pearl" cx=".36" cy=".32" r=".75">
      <stop offset="0" stop-color="#FFFFFF" /><stop offset=".25" stop-color="#FDFBF7" />
      <stop offset=".7" stop-color="#ECE4D8" /><stop offset="1" stop-color="#C8BBA6" />
    </radialGradient>
    <radialGradient id="petalGrad" cx=".5" cy=".75" r=".8">
      <stop offset="0" stop-color="#FFFEFB" /><stop offset=".6" stop-color="#F7F0E4" /><stop offset="1" stop-color="#E4D6BF" />
    </radialGradient>
    <linearGradient id="silk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" /><stop offset=".35" stop-color="#EFE6D8" />
      <stop offset=".55" stop-color="#FFFDF9" /><stop offset=".8" stop-color="#E2D5C0" /><stop offset="1" stop-color="#F6F0E6" />
    </linearGradient>
    <linearGradient id="silk2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4ECDF" /><stop offset=".45" stop-color="#FFFFFF" /><stop offset="1" stop-color="#DCCDB4" />

    <clipPath id="archClip" clipPathUnits="objectBoundingBox">
      <path transform="scale(.01 .00625)" d="M0 160 V64 C0 40 18 26 32 18 C42 12 48 6 50 0 C52 6 58 12 68 18 C82 26 100 40 100 64 V160 Z" />
    </clipPath>

    <path id="petOuter" d="M0 -3 C-17 -12 -19 -38 0 -47 C19 -38 17 -12 0 -3 Z" />
    <path id="petSmall" d="M0 0 C-6 -4 -7 -13 0 -16 C7 -13 6 -4 0 0 Z" />

    <!-- embroidered ivory flower with a pearl centre -->
    <symbol id="peony" viewBox="-50 -50 100 100" overflow="visible">
      <g fill="url(#petalGrad)" stroke="#D6C6A9" stroke-width=".8">
        <use href="#petOuter" /><use href="#petOuter" transform="rotate(45)" /><use href="#petOuter" transform="rotate(90)" /><use href="#petOuter" transform="rotate(135)" />
        <use href="#petOuter" transform="rotate(180)" /><use href="#petOuter" transform="rotate(225)" /><use href="#petOuter" transform="rotate(270)" /><use href="#petOuter" transform="rotate(315)" />
        <g transform="rotate(22) scale(.66)">
          <use href="#petOuter" /><use href="#petOuter" transform="rotate(60)" /><use href="#petOuter" transform="rotate(120)" />
          <use href="#petOuter" transform="rotate(180)" /><use href="#petOuter" transform="rotate(240)" /><use href="#petOuter" transform="rotate(300)" />
        </g>
      </g>
      <circle r="9" fill="url(#pearl)" />
      <g fill="url(#pearl)">

        <circle cx="0" cy="15" r="2.4" /><circle cx="-10.6" cy="10.6" r="2.4" /><circle cx="-15" cy="0" r="2.4" /><circle cx="-10.6" cy="-10.6" r="2.4" />

    <linearGradient id="sage" x1="0" y1="0" x2="1" y2="1">

    <!-- sage eucalyptus branch -->
    <symbol id="eucalyptus" viewBox="0 0 140 140" overflow="visible">
      <path d="M4 136 C40 104 80 64 136 6" fill="none" stroke="#7D8E70" stroke-width="1.4" stroke-linecap="round" />
      <g stroke="#6F8063" stroke-width=".6">

        <ellipse cx="64" cy="84" rx="10" ry="8" fill="url(#sage)" transform="rotate(15 64 84)" />
        <ellipse cx="66" cy="62" rx="10" ry="8" fill="url(#sage)" transform="rotate(-40 66 62)" />

        <ellipse cx="106" cy="38" rx="8" ry="6.5" fill="url(#sage)" transform="rotate(10 106 38)" />
        <ellipse cx="112" cy="20" rx="7" ry="6" fill="url(#sage)" transform="rotate(-45 112 20)" />
        <ellipse cx="128" cy="16" rx="6" ry="5" fill="url(#sageLight)" />
      </g>
    </symbol>

    <!-- slim sage leaf -->
    <symbol id="sageLeaf" viewBox="0 -10 44 20" overflow="visible">
      <path d="M0 0 C10 -10 30 -10 44 0 C30 10 10 10 0 0 Z" fill="url(#sage)" stroke="#6F8063" stroke-width=".6" />
      <path d="M3 0 H40" stroke="#E4EADB" stroke-width=".7" opacity=".8" />
    </symbol>

    <!-- embroidered cluster for corners (flowers + sequins + sprigs) -->
    <symbol id="cluster" viewBox="-130 -130 260 260" overflow="visible">
      <use href="#sprig" x="0" y="0" width="120" height="120" transform="translate(-20 -110) scale(1.1)" />
      <use href="#sprig" x="0" y="0" width="120" height="120" transform="translate(-10 10) rotate(90) scale(.9)" />
      <use href="#eucalyptus" x="0" y="0" width="140" height="140" transform="translate(-40 -150) rotate(8) scale(1.05)" />
      <use href="#eucalyptus" x="0" y="0" width="140" height="140" transform="translate(-150 40) rotate(-10) scale(.95)" />
      <use href="#eucalyptus" x="0" y="0" width="140" height="140" transform="translate(30 -20) rotate(55) scale(.7)" />
      <use href="#sageLeaf" x="0" y="-10" width="44" height="20" transform="translate(-6 30) rotate(110) scale(1.4)" />
      <use href="#sageLeaf" x="0" y="-10" width="44" height="20" transform="translate(30 -40) rotate(-30) scale(1.3)" />
      <use href="#sageLeaf" x="0" y="-10" width="44" height="20" transform="translate(-70 -30) rotate(-150) scale(1.2)" />
      <use href="#sageLeaf" x="0" y="-10" width="44" height="20" transform="translate(-60 30) rotate(160) scale(1.1)" />
      <use href="#peony" x="-50" y="-50" width="100" height="100" transform="translate(-30 -10) scale(1.05)" />
      <use href="#peony" x="-50" y="-50" width="100" height="100" transform="translate(48 -58) rotate(25) scale(.62)" />
      <use href="#peony" x="-50" y="-50" width="100" height="100" transform="translate(-90 60) rotate(-15) scale(.55)" />
      <use href="#blossom" x="-20" y="-20" width="40" height="40" transform="translate(34 24) scale(1.2)" />
      <use href="#blossom" x="-20" y="-20" width="40" height="40" transform="translate(-92 -40) scale(1)" />
      <use href="#blossom" x="-20" y="-20" width="40" height="40" transform="translate(96 -100) scale(.9)" />
      <use href="#sequin" x="-16" y="-16" width="32" height="32" transform="translate(70 4) scale(.9)" />
      <use href="#sequin" x="-16" y="-16" width="32" height="32" transform="translate(-40 70) scale(.8)" />
      <use href="#sequin" x="-16" y="-16" width="32" height="32" transform="translate(-112 0) scale(.7)" />
      <use href="#sequin" x="-16" y="-16" width="32" height="32" transform="translate(10 -96) scale(.7)" />
      <g fill="url(#pearl)">
        <circle cx="-60" cy="-72" r="4" /><circle cx="86" cy="-40" r="3.4" /><circle cx="0" cy="58" r="3.6" />
        <circle cx="-118" cy="44" r="3" /><circle cx="60" cy="54" r="2.8" /><circle cx="118" cy="-70" r="2.6" />
      </g>
    </symbol>

    <!-- silk drape for corners -->
    <symbol id="drape" viewBox="0 0 300 300" overflow="visible">
      <path d="M0 0 H300 C230 24 170 40 118 92 C78 132 46 190 0 262 Z" fill="url(#silk)" />
      <path d="M0 0 H200 C150 34 110 60 78 104 C52 140 26 168 0 186 Z" fill="url(#silk2)" />
      <path d="M0 0 H110 C82 28 54 56 30 84 C18 98 8 108 0 116 Z" fill="url(#silk)" />
      <path d="M300 0 C230 24 170 40 118 92 C78 132 46 190 0 262" fill="none" stroke="#D8CAB2" stroke-width="1.2" />
      <path d="M200 0 C150 34 110 60 78 104 C52 140 26 168 0 186" fill="none" stroke="#E2D6C3" stroke-width="1" />
    </symbol>

    <!-- timeline icons -->
    <symbol id="i-guests" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="24" cy="14" r="5" /><path d="M14 38 C14 28 18 24 24 24 C30 24 34 28 34 38" />
      <circle cx="11" cy="18" r="4" /><path d="M3 38 C3 30 6 27 11 27 C13 27 15 27.6 16.4 28.8" />
      <circle cx="37" cy="18" r="4" /><path d="M45 38 C45 30 42 27 37 27 C35 27 33 27.6 31.6 28.8" />
    </g></symbol>
    <symbol id="i-nikah" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
      <!-- curtain -->
      <path d="M15.5 6.5 H32.5" /><circle cx="15" cy="6.5" r="1" /><circle cx="33" cy="6.5" r="1" />
      <path d="M18 7 C19.6 18 17.4 30 18.6 41 Q20.6 39 22.6 41.4 Q24 39.4 25.4 41.4 Q27.4 39 29.4 41 C30.6 30 28.4 18 30 7" />
      <path d="M21 8 C22.2 19 20.6 30 21.4 40 M24 8 V40.5 M27 8 C25.8 19 27.4 30 26.6 40" opacity=".55" />
      <!-- bride with veil -->
      <circle cx="8.5" cy="19" r="3.4" />
      <path d="M3 27 C3 18 5 13.5 8.5 13.5 C12 13.5 14 18 14 27" />
      <path d="M1.5 42 C1.5 32 4.5 28 8.5 28 C12.5 28 15.5 32 15.5 42" />
      <!-- groom with cap -->
      <circle cx="39" cy="19" r="3.4" />
      <path d="M35.2 17 C35.6 13.6 42.4 13.6 42.8 17 Z" />
      <path d="M32 42 C32 32 35 28 39 28 C43 28 46 32 46 42" />
      <path d="M39 29 V36" />
    </g></symbol>
    <symbol id="i-dining" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M8 32 C8 22 15 15 24 15 C33 15 40 22 40 32 Z" /><path d="M5 36 H43" /><circle cx="24" cy="12" r="2" /><path d="M16 26 C17 22 20 20 23 19" /></g></symbol>
    <symbol id="i-dua" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M23 43 C16 43 11.5 39 10.5 33 L8.5 20 C8.1 17.8 11 17.2 11.7 19.4 L13.6 26 L13 13 C13 10.6 16.4 10.6 16.5 13 L17.2 24 L17.6 10.5 C17.7 8.2 21 8.2 21 10.5 L21.4 24.5 L22.4 14.5 C22.6 12.3 25.4 12.6 25.2 14.8 L23.8 30" />
      <path d="M25 43 C32 43 36.5 39 37.5 33 L39.5 20 C39.9 17.8 37 17.2 36.3 19.4 L34.4 26 L35 13 C35 10.6 31.6 10.6 31.5 13 L30.8 24 L30.4 10.5 C30.3 8.2 27 8.2 27 10.5 L26.6 24.5 L25.6 14.5" opacity=".9" />
    </g></symbol>
  </defs>
</svg>

<!-- ============ Fixed controls ============ -->
<button class="pill pill--lang" id="langBtn" type="button">
  <svg viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9" /><path d="M3 12 H21 M12 3 C15 6 15 18 12 21 C9 18 9 6 12 3" /></g></svg>
  <span id="langLabel">বাংলা</span>
</button>
<button class="round-btn" id="musicBtn" type="button" aria-pressed="false" hidden>
  <svg viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10 V14 H8 L13 18 V6 L8 10 Z" /><path class="wave" d="M16.5 9 C17.7 10.5 17.7 13.5 16.5 15" /><path class="wave" d="M19 6.5 C21.5 9.5 21.5 14.5 19 17.5" /><path class="mute" d="M16 9 L21 15 M21 9 L16 15" /></g></svg>
</button>
<audio id="music" loop preload="auto"></audio>

<!-- ============ INTRO: Bismillah, then the ayah (behind the envelope) ============ -->
<div class="intro" id="intro" aria-live="polite">
  <div class="intro__glow"></div>
  <svg class="drape drape--tl" viewBox="0 0 300 300" aria-hidden="true"><use href="#drape" /></svg>
  <svg class="drape drape--br" viewBox="0 0 300 300" aria-hidden="true"><use href="#drape" /></svg>
  <div class="frame frame--intro" aria-hidden="true"></div>

  <div class="intro-step" id="stepAyah">
    <p class="ayah reveal" lang="ar" dir="rtl" id="ayahText"></p>
    <p class="ayah-trans reveal" data-t="ayahTrans"></p>
    <p class="ayah-ref reveal" data-t="ayahRef"></p>
    <div class="pearl-divider reveal" aria-hidden="true"></div>
    <p class="intro-names goldtext reveal"><span data-t="brideShort"></span> <span class="intro-and" data-t="and"></span> <span data-t="groomShort"></span></p>
    <p class="intro-date reveal" id="introDate"></p>
  </div>

  <p class="intro-hint" data-t="tapToContinue"></p>
</div>

<!-- ============ ENVELOPE (opens like two doors) ============ -->
<div class="envelope" id="envelope">
  <div class="env-door env-door--left">
    <div class="door-frame"></div>
    <svg class="door-cluster door-cluster--top" viewBox="-130 -130 260 260" aria-hidden="true"><use href="#cluster" x="-130" y="-130" width="260" height="260" /></svg>
    <svg class="door-cluster door-cluster--bottom" viewBox="-130 -130 260 260" aria-hidden="true"><use href="#cluster" x="-130" y="-130" width="260" height="260" /></svg>
    <svg class="strand door-strand" viewBox="0 0 120 600" data-path="M110 0 C40 120 10 220 20 320 C30 430 80 520 110 600" data-gap="12.5" data-r="4.6" aria-hidden="true"></svg>
    <span class="door-seam"></span>
  </div>
  <div class="env-door env-door--right">
    <div class="door-frame"></div>
    <svg class="door-cluster door-cluster--top" viewBox="-130 -130 260 260" aria-hidden="true"><use href="#cluster" x="-130" y="-130" width="260" height="260" /></svg>
    <svg class="door-cluster door-cluster--bottom" viewBox="-130 -130 260 260" aria-hidden="true"><use href="#cluster" x="-130" y="-130" width="260" height="260" /></svg>
    <svg class="strand door-strand" viewBox="0 0 120 600" data-path="M110 0 C40 120 10 220 20 320 C30 430 80 520 110 600" data-gap="12.5" data-r="4.6" aria-hidden="true"></svg>
    <span class="door-seam"></span>
  </div>

  <div class="seal-wrap">
    <span class="seal-glow" aria-hidden="true"></span>
    <span class="seal-orbit" aria-hidden="true"></span>
    <button class="seal" id="seal" type="button" aria-label="Open the invitation">
      <svg viewBox="0 0 120 120" aria-hidden="true">
        <path class="seal__wax" d="M60 4 C68 4 70 9 77 10 C85 11 89 7 95 12 C101 17 98 23 102 29 C106 35 113 37 114 45 C115 53 109 56 110 63 C111 71 116 76 113 84 C110 92 103 91 99 98 C95 104 96 111 88 114 C80 117 76 111 68 113 C61 115 57 120 49 117 C41 114 41 108 34 104 C27 100 20 102 15 95 C10 88 14 82 11 75 C8 68 2 64 4 56 C6 48 12 46 13 39 C14 31 9 25 14 19 C19 13 26 16 32 12 C39 8 41 4 49 4 C53 4 56 4 60 4 Z" />
        <circle cx="60" cy="60" r="40" class="seal__ring" />
        <circle cx="60" cy="60" r="35" class="seal__ring seal__ring--thin" />
      </svg>
      <span class="seal__mono" id="monogram">E&amp;N</span>
    </button>
  </div>

  <p class="env-hint" data-t="tapToOpen">Tap the seal to open</p>
  <button class="pill pill--skip" id="skipBtn" type="button" data-t="skip">Skip</button>
</div>

<!-- ============ PAGE ============ -->
<main id="page" tabindex="-1">

  <!-- Invitation -->
  <section class="invite-screen" aria-label="Invitation">
    <svg class="drape drape--tl" viewBox="0 0 300 300" aria-hidden="true"><use href="#drape" /></svg>
    <svg class="drape drape--br" viewBox="0 0 300 300" aria-hidden="true"><use href="#drape" /></svg>
    <svg class="corner-cluster corner-cluster--tr" viewBox="-130 -130 260 260" aria-hidden="true"><use href="#cluster" x="-130" y="-130" width="260" height="260" /></svg>
    <svg class="corner-cluster corner-cluster--bl" viewBox="-130 -130 260 260" aria-hidden="true"><use href="#cluster" x="-130" y="-130" width="260" height="260" /></svg>

    <div class="frame frame--invite">
      <svg class="strand frame-strand frame-strand--tr" viewBox="0 0 200 260" data-path="M40 0 C120 30 190 90 196 260" data-gap="11" data-r="4.2" aria-hidden="true"></svg>
      <svg class="strand frame-strand frame-strand--bl" viewBox="0 0 200 260" data-path="M40 0 C120 30 190 90 196 260" data-gap="11" data-r="4.2" aria-hidden="true"></svg>

      <div class="invite-text">
        <p class="inv-bismillah goldtext" lang="ar" dir="rtl" id="bismillahText"></p>
        <p class="inv-line1" data-t="inviteLine1"></p>
        <p class="inv-line2" data-t="inviteLine2"></p>

        <p class="inv-name goldtext fit" data-t="brideFull"></p>
        <p class="inv-parents" data-t="brideParents"></p>
        <p class="inv-and" data-t="and"></p>
        <p class="inv-name goldtext fit" data-t="groomFull"></p>
        <p class="inv-parents" data-t="groomParents"></p>
      </div>
    </div>

    <a class="scroll-hint" href="#countdownBand">
      <span data-t="scroll"></span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9 L12 15 L18 9" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" /></svg>
    </a>
  </section>

  <!-- Countdown (navy band) -->
  <section class="band" id="countdownBand">
    <div class="wrap">
      <h2 class="script-heading" data-t="countdownHeading"></h2>
      <div class="pearl-divider pearl-divider--light" aria-hidden="true"></div>
      <div class="countdown" id="countdown">
        <div class="cd"><span class="cd__num" data-unit="d">00</span><span class="cd__label" data-t="days"></span></div>
        <div class="cd"><span class="cd__num" data-unit="h">00</span><span class="cd__label" data-t="hours"></span></div>
        <div class="cd"><span class="cd__num" data-unit="m">00</span><span class="cd__label" data-t="minutes"></span></div>
        <div class="cd"><span class="cd__num" data-unit="s">00</span><span class="cd__label" data-t="seconds"></span></div>
      </div>
      <p class="countdown-done script-heading" id="countdownDone" data-t="countdownDone" hidden></p>
    </div>
  </section>

  <!-- Save the date -->
  <section class="block">
    <svg class="strand garland" viewBox="0 0 400 64" data-path="M8 4 C110 66 290 66 392 4" data-gap="11" data-r="3.8" aria-hidden="true"></svg>
    <div class="wrap">
      <h2 class="script-heading" data-t="saveHeading"></h2>
      <div class="pearl-divider" aria-hidden="true"></div>
      <p class="save-date" id="saveDate"></p>
      <a class="btn btn--gold" id="calBtn" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3.5" y="5" width="17" height="15" rx="2" /><path d="M3.5 10h17M8 3v4M16 3v4M12 13v5M9.5 15.5h5" stroke-linecap="round" /></g></svg>
        <span data-t="addCalendar"></span>
      </a>
      <p><a class="link-btn" id="icsLink" download="esmat-nasif-wedding.ics" data-t="otherCalendar"></a></p>
    </div>
  </section>

  <!-- Timeline (navy band) -->
  <section class="band">
    <div class="wrap">
      <h2 class="script-heading" data-t="timelineHeading"></h2>
      <div class="pearl-divider pearl-divider--light" aria-hidden="true"></div>
      <ol class="timeline" id="timeline"></ol>
    </div>
  </section>

  <!-- Venue -->
  <section class="block">
    <svg class="strand side-strand side-strand--left" viewBox="0 0 40 600" data-path="M30 0 C4 160 4 440 30 600" data-gap="11" data-r="3.8" aria-hidden="true"></svg>
    <div class="wrap">
      <h2 class="script-heading" data-t="venueHeading"></h2>
      <div class="pearl-divider" aria-hidden="true"></div>
      <p class="venue-name" data-t="venueName"></p>
      <p class="venue-addr" data-t="venueAddress"></p>
      <div class="map-frame"><iframe id="mapFrame" title="Map of the venue" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe></div>
      <a class="btn btn--gold" id="mapLink" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 21 s-7 -6.2 -7 -11 a7 7 0 1 1 14 0 c0 4.8 -7 11 -7 11 z" /><circle cx="12" cy="10" r="2.5" /></g></svg>
        <span data-t="viewMap"></span>
      </a>
    </div>
  </section>

  <!-- Attire -->
  <section class="block">
    <svg class="strand garland" viewBox="0 0 400 64" data-path="M8 4 C110 66 290 66 392 4" data-gap="11" data-r="3.8" aria-hidden="true"></svg>
    <svg class="strand side-strand side-strand--right" viewBox="0 0 40 600" data-path="M30 0 C4 160 4 440 30 600" data-gap="11" data-r="3.8" aria-hidden="true"></svg>
    <div class="wrap">
      <h2 class="script-heading" data-t="attireHeading"></h2>
      <div class="pearl-divider" aria-hidden="true"></div>
      <p class="body-text" data-t="attireBody"></p>
      <ul class="swatches" id="swatches"></ul>
      <p class="attire-closing" data-t="attireClosing"></p>
    </div>
  </section>

  <!-- RSVP -->
  <section class="block" id="rsvp">
    <svg class="strand side-strand side-strand--left" viewBox="0 0 40 600" data-path="M30 0 C4 160 4 440 30 600" data-gap="11" data-r="3.8" aria-hidden="true"></svg>
    <div class="wrap">
      <div class="card">
        <h2 class="script-heading" data-t="rsvpHeading"></h2>
        <div class="pearl-divider" aria-hidden="true"></div>
        <p class="rsvp-sub" data-t="rsvpSub"></p>

        <form class="rsvp" id="rsvpForm" novalidate>
          <label class="field"><span data-t="fName"></span><input name="name" id="rsvpName" autocomplete="name" maxlength="80" /></label>
          <label class="field"><span><span data-t="fPhone"></span> <em data-t="optional"></em></span><input name="phone" type="tel" inputmode="tel" autocomplete="tel" maxlength="20" /></label>
          <fieldset class="choice">
            <legend data-t="fComing"></legend>
            <label class="choice__tile"><input type="radio" name="attending" value="Yes" /><span data-t="yes"></span></label>
            <label class="choice__tile"><input type="radio" name="attending" value="No" /><span data-t="no"></span></label>
          </fieldset>
          <div class="field" id="guestsField" hidden>
            <span id="guestsLabel" data-t="fGuests"></span>
            <div class="stepper" role="group" aria-labelledby="guestsLabel">
              <button type="button" data-step="-1" aria-label="−1">−</button>
              <output id="guestsOut" aria-live="polite">1</output>
              <button type="button" data-step="1" aria-label="+1">+</button>
            </div>
          </div>
          <label class="field"><span><span data-t="fMessage"></span> <em data-t="optional"></em></span><textarea name="message" rows="3" maxlength="500"></textarea></label>
          <p class="rsvp-error" id="rsvpError" role="alert"></p>
          <button class="btn btn--gold btn--wide" id="rsvpSubmit" type="submit" data-t="send"></button>
        </form>

        <div class="rsvp-done" id="rsvpDone" tabindex="-1" hidden>
          <svg viewBox="0 0 160 90" class="rings rings--done" aria-hidden="true">
            <circle class="ring ring--1" cx="62" cy="52" r="30" pathLength="1" />
            <circle class="ring ring--2" cx="98" cy="52" r="30" pathLength="1" />
          </svg>
          <p class="script-heading rsvp-done__title" id="doneTitle"></p>
          <p class="body-text" id="doneText"></p>
          <button class="link-btn" type="button" id="rsvpAgain" data-t="change"></button>
        </div>
      </div>
    </div>
  </section>

  <!-- Contacts (sage band) -->
  <section class="band band--contacts">
    <div class="wrap">
      <h2 class="script-heading" data-t="contactsHeading"></h2>
      <div class="pearl-divider pearl-divider--light" aria-hidden="true"></div>
      <div class="contacts">
        <div class="contact-group"><h3 class="caps" data-t="brideSide"></h3><ul id="contactsBride"></ul></div>
        <div class="contact-group"><h3 class="caps" data-t="groomSide"></h3><ul id="contactsGroom"></ul></div>
      </div>
    </div>
  </section>

  <!-- Closing -->
  <footer class="closing">
    <svg class="corner-cluster corner-cluster--bl closing-cluster" viewBox="-130 -130 260 260" aria-hidden="true"><use href="#cluster" x="-130" y="-130" width="260" height="260" /></svg>
    <svg class="corner-cluster corner-cluster--br closing-cluster" viewBox="-130 -130 260 260" aria-hidden="true"><use href="#cluster" x="-130" y="-130" width="260" height="260" /></svg>
    <svg class="strand garland" viewBox="0 0 400 64" data-path="M8 4 C110 66 290 66 392 4" data-gap="11" data-r="3.8" aria-hidden="true"></svg>
    <div class="wrap">
      <p class="caps" data-t="blessing"></p>
      <p class="closing-names goldtext"><span data-t="brideShort"></span><span class="closing-and" data-t="and"></span><span data-t="groomShort"></span></p>
      <p class="credit"><span data-t="credit"></span><br /><em data-t="joke"></em></p>
    </div>
  </footer>
</main>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
