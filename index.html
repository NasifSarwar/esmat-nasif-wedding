      <p class="body-text" data-t="attireBody"></p>
      <ul class="swatches" id="swatches"></ul>
      <p class="attire-closing" data-t="attireClosing"></p>
    </div>
  </section>

  <!-- RSVP -->
  <section class="block" id="rsvp">
    <svg class="pearl-fit side-strand side-strand--left" data-shape="line" data-match=".card" aria-hidden="true"></svg>
    <div class="wrap">
      <div class="card">
        <h2 class="script-heading" data-t="rsvpHeading"></h2>
        <div class="pearl-divider" aria-hidden="true"></div>
        <p class="rsvp-sub" id="rsvpSub" data-t="rsvpSub"></p>

        <form class="rsvp" id="rsvpForm" novalidate>
          <div class="hp" aria-hidden="true"><label>Website <input name="website" type="text" tabindex="-1" autocomplete="off" /></label></div>
          <label class="field"><span data-t="fName"></span><input name="name" id="rsvpName" autocomplete="name" maxlength="80" /></label>
          <label class="field"><span><span data-t="fPhone"></span> <em data-t="optional"></em></span><input name="phone" type="tel" inputmode="tel" autocomplete="tel" maxlength="20" /></label>
          <fieldset class="choice">
            <legend data-t="fComing"></legend>
            <label class="choice__tile"><input type="radio" name="attending" value="Yes" /><span data-t="yes"></span></label>
            <label class="choice__tile"><input type="radio" name="attending" value="No" /><span data-t="no"></span></label>
          </fieldset>
          <label class="field"><span><span data-t="fMessage"></span> <em data-t="optional"></em></span><textarea name="message" rows="2" maxlength="500"></textarea></label>
          <p class="rsvp-error" id="rsvpError" role="alert"></p>
          <button class="btn btn--gold btn--wide" id="rsvpSubmit" type="submit" data-t="send"></button>
        </form>

        <div class="rsvp-done" id="rsvpDone" tabindex="-1" hidden>
          <svg viewBox="0 0 160 90" class="rings rings--done" aria-hidden="true">
            <circle class="ring ring--1" cx="62" cy="52" r="30" pathLength="1" />
            <circle class="ring ring--2" cx="98" cy="52" r="30" pathLength="1" />
          </svg>
          <p class="script-heading rsvp-done__title" id="doneTitle"></p>
          <p class="body-text" id="doneText"></p>
        </div>
      </div>
    </div>
  </section>

  <!-- Contacts (sage band) -->
  <section class="band band--contacts">
    <div class="wrap">
      <h2 class="script-heading" data-t="contactsHeading"></h2>
      <div class="pearl-divider pearl-divider--light" aria-hidden="true"></div>
      <div class="contacts">
        <div class="contact-group"><h3 class="caps" data-t="brideSide"></h3><ul id="contactsBride"></ul></div>
        <div class="contact-group"><h3 class="caps" data-t="groomSide"></h3><ul id="contactsGroom"></ul></div>
      </div>
    </div>
  </section>

  <!-- Closing -->
  <footer class="closing">
    <svg class="corner-cluster corner-cluster--bl closing-cluster" viewBox="-130 -130 260 260" aria-hidden="true"><use href="#cluster" x="-130" y="-130" width="260" height="260" /></svg>
    <svg class="corner-cluster corner-cluster--br closing-cluster" viewBox="-130 -130 260 260" aria-hidden="true"><use href="#cluster" x="-130" y="-130" width="260" height="260" /></svg>
    <svg class="strand garland" viewBox="0 0 400 64" data-path="M8 4 C110 66 290 66 392 4" data-gap="11" data-r="3.8" aria-hidden="true"></svg>
    <div class="wrap">
      <p class="caps blessing"><span data-t="blessing1"></span> <span class="blessing__2" data-t="blessing2"></span></p>
      <p class="closing-names goldtext"><span data-t="brideShort"></span><span class="closing-and" data-t="and"></span><span data-t="groomShort"></span></p>
      <p class="credit"><span data-t="credit"></span><br /><em data-t="joke"></em></p>
      <p class="copyright">© 2026 Esmat &amp; Nasif</p>
    </div>
  </footer>
</main>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
